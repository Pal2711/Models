<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Studio - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0c10 0%, #0f1117 50%, #030507 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(88, 166, 255, 0.08) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(17, 20, 24, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(42, 46, 54, 0.8);
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease;
        }

        .login-card:hover {
            border-color: rgba(88, 166, 255, 0.3);
            box-shadow: 0 30px 60px -12px rgba(88, 166, 255, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e2e8f0, #9ca3af);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 0.85rem;
        }

        .login-card h2 {
            text-align: center;
            color: #eef2ff;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 8px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #0f1117;
            border: 1px solid #2a2e36;
            border-radius: 16px;
            color: #e9edf2;
            outline: none;
        }

        .input-group input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        /* PASSWORD TOGGLE */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            font-size: 16px;
        }

        .toggle-password:hover {
            color: #58a6ff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #58a6ff, #3b82f6);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-message {
            margin-top: 20px;
            padding: 12px;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 12px;
            text-align: center;
            color: #f87171;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">
            <h1>✦ MODEL STUDIO</h1>
            <p>Professional Model Hub</p>
        </div>

        <h2>Welcome Back</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Enter your username">
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                    <span class="toggle-password" onclick="togglePassword()">👁</span>
                </div>

            </div>

            <button type="submit" class="login-btn">LogIn →</button>
        </form>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.textContent = "🙈";
    } else {
        passwordInput.type = "password";
        icon.textContent = "👁";
    }
}
</script>

</body>
</html>
