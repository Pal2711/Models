<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dark Theme</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 350px;
            border: 1px solid #333;
        }
        
        .login-box {
            width: 100%;
        }
        
        h2 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }
        
        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            margin: 10px auto 0;
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid #333;
            font-size: 15px;
            color: #fff;
            background: transparent;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-bottom-color: #00ff88;
        }
        
        .input-group input:hover {
            border-bottom-color: #555;
        }
        
        .input-group input::placeholder {
            color: #555;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .login-footer {
            margin-top: 25px;
            text-align: center;
        }
        
        .login-footer a {
            color: #00ff88;
            text-decoration: none;
            font-size: 13px;
            margin: 0 10px;
            transition: color 0.3s ease;
        }
        
        .login-footer a:hover {
            color: #00ccff;
            text-decoration: underline;
        }
        
        .error-message {
            background: #2a1a1a;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            border-left: 3px solid #ff6b6b;
        }
        
        .success-message {
            background: #1a2a1a;
            color: #6bff6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            border-left: 3px solid #6bff6b;
        }
        
        .password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            display: none;
        }
        
        .input-group input:focus + .password-requirements {
            display: block;
        }
        
        /* Loading state for button */
        button.loading {
            position: relative;
            pointer-events: none;
            opacity: 0.8;
        }
        
        button.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive design */
        @media (max-width: 400px) {
            .login-container {
                padding: 30px 20px;
            }
            
            h2 {
                font-size: 28px;
            }
            
            button {
                padding: 10px;
                font-size: 14px;
            }
        }
        
        /* Show/hide password toggle */
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 0;
            bottom: 12px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            user-select: none;
        }
        
        .toggle-password:hover {
            color: #00ff88;
        }
        
        /* Additional dark theme elements */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff88, #00ccff, transparent);
        }
        
        /* Optional: Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(0, 204, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>LOG IN</h2>
            
            <!-- Optional: Add error message if needed -->
            <!-- <div class="error-message">Invalid username or password</div> -->
            
            <!-- Optional: Add success message if needed -->
            <!-- <div class="success-message">Login successful! Redirecting...</div> -->
            
            <form method="POST" id="loginForm">
                {% csrf_token %}
                
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label>PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <span class="toggle-password" onclick="togglePassword()">SHOW</span>
                    </div>
                    <div class="password-requirements">
                        Password must be at least 8 characters long
                    </div>
                </div>
                
                <button type="submit" id="submitBtn">ENTER</button>
            </form>
            
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleText = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'HIDE';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'SHOW';
            }
        }
        
        // Form submission with loading effect
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const button = document.getElementById('submitBtn');
            button.classList.add('loading');
            button.textContent = 'LOGGING IN...';
            
            // Remove loading state after 2 seconds (for demo)
            setTimeout(() => {
                button.classList.remove('loading');
                button.textContent = 'ENTER';
            }, 2000);
        });
        
        // Input validation with dark theme colors
        document.querySelector('input[name="username"]').addEventListener('input', function(e) {
            if (this.value.length > 0) {
                this.style.borderBottomColor = '#00ff88';
            } else {
                this.style.borderBottomColor = '#333';
            }
        });
        
        document.querySelector('input[name="password"]').addEventListener('input', function(e) {
            if (this.value.length >= 8) {
                this.style.borderBottomColor = '#00ff88';
            } else if (this.value.length > 0) {
                this.style.borderBottomColor = '#ff6b6b';
            } else {
                this.style.borderBottomColor = '#333';
            }
        });
    </script>
</body>
</html>
